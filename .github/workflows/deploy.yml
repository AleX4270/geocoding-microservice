name: Build And Deploy To Production

on:
    push:
        branches: 
            - main
    
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_OWNER: alex4270
    APP_IMAGE: geocoding-microservice

jobs:
    # test-backend:
    #   uses: ./.github/workflows/test_backend.yml

    build-app:
        runs-on: ubuntu-latest
        # needs: [test-backend]

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                registry: ${{env.REGISTRY}}
                username: ${{github.actor}}
                password: ${{secrets.GITHUB_TOKEN}}

            - name: Build and push backend image
              uses: docker/build-push-action@v6
              with:
                context: .
                file: ./docker/backend/Dockerfile
                platforms: linux/amd64
                push: true
                tags: |
                    ${{env.REGISTRY}}/${{env.IMAGE_OWNER}}/${{env.APP_IMAGE}}:latest
                    ${{env.REGISTRY}}/${{env.IMAGE_OWNER}}/${{env.APP_IMAGE}}:${{github.sha}}
                cache-from: type=gha
                cache-to: type=gha,mode=max

    deploy:
        runs-on: ubuntu-latest
        needs: [build-app]

        steps:
            - name: Deploy to production (ssh)
              uses: appleboy/ssh-action@v1
              with: 
                host: ${{secrets.SSH_HOST}}
                username: ${{secrets.SSH_USERNAME}}
                key: ${{secrets.SSH_PRIVATE_KEY}}
                port: ${{secrets.SSH_PORT}}
                script: |
                    set -e
                    cd /var/www/geocoding

                    echo "${{secrets.ENV_PRODUCTION}}" | base64 -d > .env.production
                    chmod 600 .env.production

                    echo "${{secrets.GITHUB_TOKEN}}" | docker login ghcr.io -u ${{github.actor}} --password-stdin

                    export APP_TAG=${{github.sha}}

                    docker compose -f compose.yaml -f compose.prod.yaml pull

                    docker compose -f compose.yaml -f compose.prod.yaml up -d --remove-orphans

                    docker image prune -f
